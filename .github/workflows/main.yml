name: My First Workflow

# 1. Trigger the workflow on every push to the repository
on: [push]

jobs:
  # 2. Define a job named "say-hello"
  say-hello:
    # 3. Tell GitHub to run this on an Ubuntu virtual machine
    runs-on: ubuntu-latest

    # 4. Define the sequential steps for this job
    steps:
      - name: Print a welcome message
        run: echo "Hello World! GitHub Actions is working."

      - name: Check the server time
        run: date
